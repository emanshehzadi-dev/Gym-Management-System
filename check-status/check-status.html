<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Status</title>

    <link rel="stylesheet" href="check-status.css">
</head>

<body>

    <!-- ================= Check Status Container ================= -->

    <div class="check-status-container">

        <div class="check-status-box">

            <!-- Page Title -->

            <h1 class="page-title">Check Status</h1>

            <!-- Page Description -->

            <p class="page-description">
                Enter your registered Gmail and CNIC to check your status.
            </p>


            <!-- ================= Check Status Form ================= -->

            <form id="checkStatusForm">

                <!-- Gmail -->

                <label for="email">Registered Gmail</label>

                <input type="email" id="email" placeholder="Enter your registered Gmail">
                    <small id="emailError"></small>


                <!-- CNIC -->

                <label for="cnic">CNIC</label>

                <input type="text" id="cnic" placeholder="Enter your CNIC">
                    <small id="cnicError"></small>
                    
                


                <!-- Check Status Button -->

                <div class="form-actions">

                    <button type="submit">
                        Check Status
                    </button>

                </div>

            </form>


            <!-- ================= Status Result ================= -->

            <div id="statusResult"></div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="check-status.js"></script>

</body>

</html>
